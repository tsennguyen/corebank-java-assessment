spring:
  application:
    name: core-banking
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true
  datasource:
    hikari:
      connection-init-sql: "SET lock_timeout = '3s'"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: core
  flyway:
    enabled: true
    schemas: core
    default-schema: core

app:
  business-zone: Asia/Ho_Chi_Minh
  version: "@project.version@"
  idempotency:
    ttl-hours: 24
    cleanup-cron: "0 0 3 * * *"
  statistics:
    balance-tiers:
      medium-threshold: 10000000.00
      high-threshold: 100000000.00
  fees:
    withdrawal:
      - min-amount: 0.00
        flat-fee: 2000.00
      - min-amount: 10000000.00
        rate-percent: 0.02
        max-fee: 50000.00
    transfer:
      - min-amount: 0.00
        flat-fee: 0.00
      - min-amount: 500000.00
        flat-fee: 2000.00
      - min-amount: 10000000.00
        rate-percent: 0.02
        max-fee: 50000.00
    deposit:
      - min-amount: 0.00
        flat-fee: 0.00
    payment:
      - min-amount: 0.00
        flat-fee: 0.00

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
    doc-expansion: none

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
