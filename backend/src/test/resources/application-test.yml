spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        default_schema: core
  flyway:
    enabled: true
    schemas: core
    default-schema: core
    locations: classpath:db/migration

app:
  business-zone: Asia/Ho_Chi_Minh
  recurring:
    scheduler-enabled: false
    batch-size: 50
    max-failures: 3
