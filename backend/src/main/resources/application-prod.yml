server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DATABASE_URL:${SPRING_DATASOURCE_URL}}
    username: ${DATABASE_USER:${SPRING_DATASOURCE_USERNAME}}
    password: ${DATABASE_PASSWORD:${SPRING_DATASOURCE_PASSWORD}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:5}
      minimum-idle: 1
      connection-timeout: 5000
      data-source-properties:
        options: "-c lock_timeout=3000"
  jpa:
    show-sql: false
  flyway:
    enabled: true
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration}
